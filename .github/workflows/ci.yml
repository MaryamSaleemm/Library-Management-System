name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - integration
      - staging
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  lint-test-build:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_DB: library
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL Connection
        run: |
          python - <<EOF
          import os
          import psycopg2

          conn = psycopg2.connect(
              host=os.environ["DB_HOST"],
              database=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              port=os.environ["DB_PORT"]
          )

          print("PostgreSQL Connected Successfully")
          conn.close()
          EOF

      - name: Run Alembic Migration
        run: |
          alembic upgrade head

      - name: Run Flake8
        run: |
          flake8 . --exclude=migrations

      - name: Run Pytest
        run: |
          pytest -v

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$OWNER/library-management-system:latest .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$OWNER/library-management-system:latest




          #  the PostgreSQL service initialization variables
          #  because GitHub Actions doesn't allow secrets in the services.env section. Since that PostgreSQL 
          #  instance is a temporary CI container created only
          #  for testing, those values are not production secrets."